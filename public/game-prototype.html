function prototype(){const s=screens.find(x=>x.id===current)||screens[3];return `<div class="intro"><div><div class="eyebrow">02 / CLICKABLE MOBILE PROTOTYPE</div><h1>看页面，也看它如何连起来。</h1><p class="muted mainHint">所有按钮用于本地设计演示，不修改真实宠物。只有当前本人视角；评审结果场景不代表可切换玩家。表单不采集真实资料。</p></div><div class="legend">${tag(s.status)}</div></div><div class="review"><aside class="screenlist"><input id="search" value="${escapeHTML(search)}" placeholder="搜索页面…" aria-label="搜索页面"><div id="screenitems">${screenItems()}</div></aside><section class="phoneArea"><div class="phone"><div class="statusbar"><span>9:41</span><span>●●●　▰</span></div><div class="phonehead"><button data-act="back" aria-label="返回">‹</button><b>jagat<span style="color:#df8ba1">●</span></b><button data-go="profile" aria-label="我的资料">🌷</button></div><div class="phonescroll">${content(s)}</div>${nav()}</div><p class="phoneCaption">390px 手机画布 · ${s.title} · 页面内部可滚动</p></section><aside class="spec"><div class="panel"><div><div class="eyebrow">SCREEN / ${s.id.toUpperCase()}</div><h2>${s.title}</h2>${tag(s.status)}<h3>① 当前代码已有</h3><p>${s.current}</p><h3>② 目标页面从上到下</h3><p>${s.layout.replaceAll(' → ','<br>↓<br>')}</p></div><div><h3>③ 点击后如何反馈</h3><p>实线页面入口直接跳转；动作按钮提供动画、状态变化或结果弹窗。新功能是本地模拟，尚未接后端。</p><h3>④ 关键规则与异常</h3><ul>${s.notes.map(n=>`<li>${n}</li>`).join('')}</ul><h3>⑤ 评审时先问</h3><p>首屏知道要做什么吗？能找到下一步吗？等待对方、失败和退出时是否清楚？</p><button class="back" data-view="inventory">查看现状差异 ↗</button></div></div></aside></div>`}
function screenItems(){return [...new Set(screens.map(s=>s.group))].map(g=>{const items=screens.filter(s=>s.group===g&&(s.title+s.current).includes(search));return items.length?`<h4>${g}</h4>${items.map(s=>`<button class="${current===s.id?'active':''}" data-go="${s.id}"><span>${s.title}</span>${tag(s.status)}</button>`).join('')}`:''}).join('')}

function flowView(){return `<div class="eyebrow">03 / USER JOURNEYS</div><h1>六条关键路径，把页面串成体验。</h1><p class="muted">每个流程节点可点击。这里的跨设备阶段是流程说明，不会模拟成一个人能操作两位。</p>${flows.map(([t,ids,n],i)=>`<section class="panel" style="margin:18px 0"><h2>0${i+1} / ${t}</h2><p class="muted">${n}</p><div class="flowline">${ids.map((id,j)=>`${j?'<span class="arrow">→</span>':''}<button class="flowstep" data-go="${id}">${screens.find(s=>s.id===id).title}<small>${screens.find(s=>s.id===id).layout.split(' → ')[0]}</small></button>`).join('')}</div></section>`).join('')}<div class="panel"><h2>秘密投票的三种结果</h2><div class="grid"><div><h3>♡ 永远的家</h3><p>两人都留下，继续养成和地图冒险。</p></div><div><h3>✦ 星球毕业</h3><p>两人都旅行，保留纪念册与旅行剧情。</p></div><div><h3>☁ 再商量一次</h3><p>选择不同，团子先留在小家，双方可重新决定。</p></div></div></div>`}
function inventory(){return `<div class="eyebrow">04 / CURRENT → PROPOSED</div><h1>哪些真的有，哪些需要开发。</h1><p class="muted">依据当前仓库 src/main.tsx 与14个页面组件核对。此文件是一份目标模型，不代表新功能已进入游戏。</p><div class="panel inventory"><table><thead><tr><th>页面 / 场景</th><th>状态</th><th>当前实现</th><th>目标布局 / 改进</th></tr></thead><tbody>${screens.map(s=>`<tr><td><button data-go="${s.id}">${s.title} ↗</button></td><td>${tag(s.status)}</td><td>${s.current}</td><td>${s.layout}<br><span class="muted">${s.notes[0]}</span></td></tr>`).join('')}</tbody></table></div>`}
function decisions(){return `<div class="eyebrow">05 / REVIEW & NEXT ITERATION</div><h1>先看清规则，再决定怎么优化。</h1><p class="muted">所有好想法已纳入产品模型；涉及产品边界与资产规则的方案保留明确标记，不直接替换线上行为。</p><div class="issues"><section class="panel"><h2>保留的设计底线</h2><p>① 一人建房，另一人亲自接受才开启正式周期。</p><p>②「我」只展示与修改个人资料，无A/B切换。</p><p>③ 免费照料足够成长，不付费救命。</p><p>④ 秘密选择、私人信件通过服务端隔离。</p><p>⑤ 99天毕业后可继续陪伴；模拟估值不等于现金。</p></section><section class="panel"><h2>待确认的规则变化</h2><p>单养→共养：保留为后续模式；先给未绑定用户无奖励试玩。</p><p>个人衣橱：新增归属，需要迁移旧共享背包，不能直接把旧物品分给一人。</p><p>暂停/托管：新增快照与撤权，需与现有解除清除逻辑区分。</p><p>宽限徽章：文档的5日/48小时/粮仓参数是测试起点，暂不替换现有数值。</p></section><section class="panel"><h2>先做出“我们养出来的特点”</h2><p>第一批：共同习惯、接力事件、成长反差卡、轻角色邀请。</p><p>第二批：明信片、统一回忆、捏脸、宽限徽章。</p><p>第三批：公开授权与撤回、精选故事页、来访簿。</p><p>基础规则同步补齐：衣橱归属、暂停托管、毕业后延续。</p></section><section class="panel"><h2>接入与观察</h2><p>Jagat身份/好友/路由/深链需要实际联调；当前公网演示不直接改成站内专用。</p><p>观察：邀请接受 → 首次照料 → 接力回应 → D7复访；生成卡、分享唤起和真实发帖分别计。</p><p>真实支付、现金双选、会员、广告需正式适配；陌生人交易、争议社区、实体履约不放首轮。</p></section></div><section class="panel" style="margin-top:18px"><h2>建议你按这四轮评审</h2><p>1. 先走邀请到小窝，确认开始条件和人物身份。</p><p>2. 只看首页首屏，决定最重要的一个按钮。</p><p>3. 各做一次习惯、接力、寻宠，判断是惊喜还是负担。</p><p>4. 再看成长、分享和毕业，判断是否有值得留下的故事。</p><p class="muted">资料依据：原V3需求、当前仓库、BRD/MRD v1.2第16—24页及28页创意。文档建议不是已验证增长效果。</p></section>`}
function render(){document.querySelectorAll('.topnav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$('#app').innerHTML=({map:mapView,prototype,flows:flowView,inventory,decisions}[view]||mapView)();if(view==='prototype')setupMap()}
let mapState={x:0,y:0,z:1};function updateMap(){const g=$('#mapscene');if(g)g.setAttribute('transform',`translate(${mapState.x} ${mapState.y}) scale(${mapState.z})`)}function setupMap(){const el=$('.mapview');if(!el)return;let start=null;el.addEventListener('pointerdown',e=>{if(e.target.closest('[data-go]'))return;start={x:e.clientX,y:e.clientY,mx:mapState.x,my:mapState.y};el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!start)return;mapState.x=Math.max(-200,Math.min(200,start.mx+e.clientX-start.x));mapState.y=Math.max(-150,Math.min(150,start.my+e.clientY-start.y));updateMap()});el.addEventListener('pointerup',()=>start=null);el.addEventListener('wheel',e=>{e.preventDefault();mapState.z=Math.max(.7,Math.min(2,mapState.z+(e.deltaY<0?.1:-.1)));updateMap()},{passive:false});updateMap()}
async function act(a){if(['zoomIn','zoomOut','mapReset'].includes(a)){if(a==='mapReset')mapState={x:0,y:0,z:1};else mapState.z=Math.max(.7,Math.min(2,mapState.z+(a==='zoomIn'?.15:-.15)));updateMap();return}if(a==='back'){current=historyStack.pop()||'home';render();return}if(a==='feed'){if(state.fed){toast('今日原型喂食已记录，再点不重复加XP。');return}state.fed=true;state.xp+=5;render();$('.pet')?.classList.add('happy');toast('喂食动画 · +5 XP，仅本地原型');return}if(a==='pet'){ $('.pet')?.classList.add('happy');toast('团子蹭了蹭你的手');return}if(a==='chooseRole'){state.role=state.role==='喂饭官'?'造型师':'喂饭官';render();toast('称号已选择，可随时更换');return}if(a==='copy'){const text=location.href.split('#')[0]+'#prototype/accept';try{await navigator.clipboard.writeText(text);toast('已复制原型预览链接，不是真实游戏邀请')}catch{modal('复制链接',text)}return}if(a==='bind'){state.partner=true;state.day=1;go('home');toast('原型：受邀者接受后，进入共同养宠D1');return}if(a==='editProfile'){modal('编辑我自己的资料','正式页面编辑本人昵称、头像、城市和简介。\n本评审器不保存真实资料；伙伴的私人简介不会出现在这里。');return}if(a==='habitEarly'||a==='habitExplore'){state.habit=a==='habitEarly'?'早点睡，明天再冒险':'勇敢探索，也记得回家';render();toast('我的选择已记录，等待另一位提交');return}if(a==='color'||a==='ears'){state.color++;render();toast('外观组合预览已更新');return}if(a==='tryOn'||a==='hat'||a==='applyOutfit'){state.hat=!state.hat;render();toast('已更新宠物穿搭预览，未写入线上房间');return}if(a==='wallpaper'){state.wall=!state.wall;render();return}if(a==='buy'){if(state.owned){toast('已拥有，原型防止重复购买');return}if(state.balance<100){toast('余额不足');return}state.balance-=100;state.owned=true;render();toast('模拟购买完成，进入本人衣橱；没有真实扣款');return}if(a==='claimReward'){if(state.claimed){toast('原型：已领取，不重复发奖');return}state.claimed=true;toast('D30模拟奖励已领取，未产生真实基金');return}if(/^day\d+$/.test(a)){state.day=Number(a.slice(3));render();return}if(a==='voteKeep'||a==='voteTravel'){if(state.vote){toast('我的选择已封存，不能替伙伴操作');return}state.vote=a==='voteKeep'?'留下':'旅行';render();toast('仅提交自己的选择，等待对方完成');return}if(a==='ratio'){state.ratio=(state.ratio+1)%3;render();return}if(a==='hideNames'){state.hidden=!state.hidden;render();return}if(a==='paw'){state.paws++;render();toast('本地爪印已留下；不是站内活跃或真实发布');return}if(a==='resetPrototype'){state={fed:false,xp:280,habit:'尚未选择',role:'尚未选择',day:30,color:0,hat:false,wall:false,partner:false,vote:null,claimed:false,hidden:false,ratio:0,paws:8,balance:320,owned:false};toast('本原型已重置，真实游戏数据不受影响');render();return}if(a==='downloadCard'){try{const canvas=document.createElement('canvas');canvas.width=720;canvas.height=960;const c=canvas.getContext('2d');if(!c)throw Error();c.fillStyle='#fff0e8';c.fillRect(0,0,720,960);c.textAlign='center';c.fillStyle='#356950';c.font='bold 45px sans-serif';c.fillText('Jagat 共同成长卡',360,130);c.fillStyle='#f7a8b8';c.beginPath();c.ellipse(360,420,145,130,0,0,Math.PI*2);c.fill();c.fillStyle='#303d39';c.font='45px sans-serif';c.fillText('• ᴗ •',360,440);c.font='30px sans-serif';c.fillText(state.hidden?'我们家的小团子':'小夏 & 阿林的团子',360,660);c.fillText('谁教它抱着饭碗睡觉？',360,730);c.font='22px sans-serif';c.fillText('设计原型示意 · 非真实游戏记录',360,870);const link=document.createElement('a');link.download='Jagat-原型示意卡.png';link.href=canvas.toDataURL('image/png');link.click();toast('原型示意PNG已生成')}catch{modal('图片导出失败','当前浏览器无法导出图片，请换浏览器或截图保存。')}return}

document.addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-act],[data-view],[data-close],[data-color],[data-day]');if(!b)return;if(b.hasAttribute('data-close')){$('#overlay').innerHTML='';return}if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.view){setView(b.dataset.view);return}if(b.dataset.act){act(b.dataset.act);return}if(b.dataset.color){state.color=Number(b.dataset.color);render();return}if(b.dataset.day){modal('D'+b.dataset.day+' · 成长日详情','查看照料、本人/伙伴参与、成长变化、宠物日记与阶段奖励。此处为原型示意。')}});document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;$('#screenitems').innerHTML=screenItems()}});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#overlay').innerHTML='';if(e.key==='Tab'&&$('#overlay .modal')){const f=[...$('#overlay .modal').querySelectorAll('button')];if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus()}}});function fromHash(){let [v,id]=location.hash.slice(1).split('/');if(['map','prototype','flows','inventory','decisions'].includes(v))view=v;if(id&&screens.some(s=>s.id===id))current=id;render()}window.addEventListener('hashchange',fromHash);fromHash();
